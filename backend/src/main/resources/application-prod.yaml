app:
  frontend:
    url: https://bank-frontend-l654.onrender.com
    origin: https://bank-frontend-l654.onrender.com

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    default-schema: public
    schemas: public
    clean-disabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        connection:
          useUnicode: true
          characterEncoding: UTF-8
          charSet: UTF-8
